<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Rithy AI Prompt Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">Gemini Vision AI Prompt Extractor</h1>
        <input type="file" id="imageInput" accept="image/*" class="mb-4">
        <button onclick="upload()" class="bg-blue-500 text-white px-4 py-2 rounded">Extract Prompt</button>
        <textarea id="output-area" class="w-full h-40 mt-4 border p-2" placeholder="Result will appear here..."></textarea>
    </div>
    <script>
        async function upload() {
            const file = document.getElementById('imageInput').files[0];
            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64 = reader.result.split(',')[1];
                const res = await fetch('/api/analyze', { method: 'POST', body: JSON.stringify({ image: base64 }) });
                const data = await res.json();
                document.getElementById('output-area').value = data.prompt;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
