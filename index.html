<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rithy Prompt AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@google/genai@0.1.1/dist/index.umd.min.js"></script>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 4px solid #1a73e8; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>រិទ្ធី អេអាយ - កម្មវិធីបង្កើត Prompt</h2>
    
    <!-- កន្លែងដាក់ API Key ផ្ទាល់ដើម្បីឱ្យប៊ូតុងដំណើរការបានស្រួល -->
    <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="បំពេញ API Key របស់អ្នកទីនេះ (AIzaSy...)">
    </div>

    <div class="form-group">
        <label>បញ្ចូលសំណួរ ឬបញ្ជា:</label>
        <textarea id="promptInput" rows="4" placeholder="សរសេរអ្វីដែលអ្នកចង់ឱ្យ AI ຊួយ..."></textarea>
    </div>

    <button id="generateBtn" onclick="runGemini()">បង្កើត Prompt ឥឡូវនេះ</button>

    <div id="result">លទ្ធផលនឹងបង្ហាញទីនេះ...</div>
</div>

<script>
    async function runGemini() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const promptText = document.getElementById('promptInput').value.trim();
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert('សូមបញ្ចូល API Key ជាមុនសិន!');
            return;
        }

        if (!promptText) {
            alert('សូមវាយបញ្ចូលអត្ថបទសំណួរជាមុនសិន!');
            return;
        }

        resultDiv.innerText = 'កំពុងដំណើរការ សូមរង់ចាំបន្តិច...';

        try {
            // ប្រើប្រាស់ Google Gen AI SDK ត្រឹមត្រូវតាមស្ដង់ដារ
            const ai = new GoogleGenAI({ apiKey: apiKey });
            const response = await ai.models.generateContent({
                model: 'gemini-2.5-flash',
                contents: promptText,
            });

            resultDiv.innerText = response.text;
        } catch (error) {
            resultDiv.innerText = 'មានបញ្តហាក្នុងការតភ្ជាប់: ' + error.message;
        }
    }
</script>

</body>
</html>
